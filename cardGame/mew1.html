<template id="GameOver">
    <div class="overlayBox">
        <p>Game over! Try again!</p>
        <button id="playAgainBtn">Play Again</button>
    </div>
    <div class="overlayBoxBg"></div>
</template>

</template>
<div id="win"></div>
